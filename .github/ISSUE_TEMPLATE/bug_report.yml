name: Bug report
description: Report an application problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Click...\n3. See error..."
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Sanitized app report
      description: Paste a sanitized report if the app generated one.
